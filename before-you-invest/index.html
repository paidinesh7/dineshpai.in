<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Before You Invest — Indian Financial Products</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500;600&family=Noto+Sans+Kannada:wght@400;500;600&family=Noto+Sans+Tamil:wght@400;500;600&family=Noto+Sans+Telugu:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #FAF9F5;
      --surface: #F2EFE9;
      --ink: #141413;
      --muted: #5C5953;
      --faint: #969188;
      --line: #E4E0D7;
      --line-dark: #141413;
      --serif: 'Newsreader', 'Noto Sans Kannada', 'Noto Sans Devanagari', 'Noto Sans Telugu', 'Noto Sans Tamil', Georgia, serif;
      --sans: 'Inter', 'Noto Sans Kannada', 'Noto Sans Devanagari', 'Noto Sans Telugu', 'Noto Sans Tamil', -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: 'JetBrains Mono', 'Noto Sans Kannada', 'Noto Sans Devanagari', 'Noto Sans Telugu', 'Noto Sans Tamil', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    body {
      max-width: 1080px;
      margin: 0 auto;
      padding: 56px 32px 96px;
      font-size: 14.5px;
      line-height: 1.55;
    }

    /* Two-column Editorial Layout: Sidebar Index + Main Spec Sheet */
    .layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 64px;
      align-items: start;
    }

    /* Left Sidebar Index */
    aside {
      position: sticky;
      top: 40px;
    }

    .brand-title {
      font-family: var(--serif);
      font-size: 23px;
      font-weight: 400;
      letter-spacing: -0.01em;
      color: var(--ink);
      margin-bottom: 4px;
    }

    .brand-sub {
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.45;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 20px;
    }

    .nav-group {
      margin-bottom: 20px;
    }

    .nav-group-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--faint);
      margin-bottom: 6px;
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .nav-item {
      width: 100%;
      text-align: left;
      appearance: none;
      background: none;
      border: none;
      font-family: var(--sans);
      font-size: 13.5px;
      color: var(--muted);
      padding: 5px 0;
      cursor: pointer;
      display: flex;
      align-items: baseline;
      gap: 10px;
      transition: color 0.12s ease;
    }

    .nav-item:hover {
      color: var(--ink);
    }

    .nav-num {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--faint);
      width: 18px;
      flex-shrink: 0;
    }

    .nav-item.active {
      color: var(--ink);
      font-weight: 600;
    }

    .nav-item.active .nav-num {
      color: var(--ink);
    }

    .sidebar-hint {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      font-family: var(--mono);
      font-size: 11px;
      color: var(--faint);
    }

    .sidebar-byline {
      margin-top: 14px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    .sidebar-byline a,
    .footer-meta a {
      color: var(--muted);
      text-decoration: underline;
      text-decoration-color: var(--line);
      text-underline-offset: 3px;
      transition: color 0.12s ease, text-decoration-color 0.12s ease;
    }

    .sidebar-byline a:hover,
    .footer-meta a:hover {
      color: var(--ink);
      text-decoration-color: var(--ink);
    }

    .byline-links {
      display: block;
      margin-top: 2px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--faint);
    }

    /* Right Spec Sheet */
    main {
      min-width: 0;
    }

    .sheet-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      flex-wrap: wrap;
      padding-bottom: 14px;
      border-bottom: 2px solid var(--line-dark);
    }

    .sheet-kicker {
      font-family: var(--mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--faint);
    }

    .compare-bar {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      color: var(--muted);
    }

    .compare-select {
      appearance: none;
      background: transparent;
      border: 1px solid var(--line);
      padding: 4px 24px 4px 8px;
      font-family: var(--sans);
      font-size: 12.5px;
      color: var(--ink);
      cursor: pointer;
      background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%),
                        linear-gradient(135deg, var(--ink) 50%, transparent 50%);
      background-position: calc(100% - 11px) center, calc(100% - 7px) center;
      background-size: 4px 4px, 4px 4px;
      background-repeat: no-repeat;
    }

    .compare-select:focus {
      outline: none;
      border-color: var(--ink);
    }

    /* Product Header Block */
    .title-block {
      padding: 24px 0;
      border-bottom: 1px solid var(--line);
    }

    .product-title {
      font-family: var(--serif);
      font-size: 32px;
      font-weight: 400;
      line-height: 1.18;
      letter-spacing: -0.01em;
      margin-bottom: 8px;
    }

    .product-what {
      font-family: var(--serif);
      font-size: 18px;
      color: var(--muted);
      line-height: 1.45;
    }

    /* 4-Cell Swiss Quick-Stat Grid */
    .stat-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-bottom: 1px solid var(--line);
    }

    .stat-cell {
      padding: 18px 16px 18px 0;
      border-right: 1px solid var(--line);
    }

    .stat-cell:not(:first-child) {
      padding-left: 18px;
    }

    .stat-cell:last-child {
      border-right: none;
      padding-right: 0;
    }

    .stat-label {
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--faint);
      margin-bottom: 6px;
    }

    .stat-val {
      font-family: var(--serif);
      font-size: 21px;
      font-weight: 500;
      color: var(--ink);
      line-height: 1.2;
      margin-bottom: 3px;
    }

    .stat-note {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.35;
    }

    /* Structured Spec Sections */
    .spec-section {
      padding: 26px 0;
      border-bottom: 1px solid var(--line);
    }

    .section-head {
      font-family: var(--mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--faint);
      margin-bottom: 14px;
    }

    .kv-table {
      display: flex;
      flex-direction: column;
    }

    .kv-row {
      display: grid;
      grid-template-columns: 190px 1fr;
      gap: 24px;
      padding: 10px 0;
      border-top: 1px solid var(--line);
      align-items: baseline;
    }

    .kv-row:first-child {
      border-top: none;
      padding-top: 0;
    }

    .kv-row:last-child {
      padding-bottom: 0;
    }

    .kv-key {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--ink);
    }

    .kv-val {
      font-size: 14.5px;
      color: var(--muted);
      line-height: 1.55;
    }

    /* Stark Editorial Block for "The Catch" */
    .catch-box {
      margin-top: 28px;
      background: var(--surface);
      border-top: 2px solid var(--line-dark);
      padding: 24px 26px;
    }

    .catch-label {
      font-family: var(--mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink);
      font-weight: 500;
      margin-bottom: 10px;
    }

    .catch-lead {
      font-family: var(--serif);
      font-size: 21px;
      line-height: 1.4;
      color: var(--ink);
      margin-bottom: 10px;
    }

    .catch-body {
      font-size: 14.5px;
      color: var(--muted);
      line-height: 1.6;
    }

    /* Language Switcher */
    .lang-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 10px;
      padding-bottom: 16px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    .lang-btn {
      appearance: none;
      background: none;
      border: none;
      padding: 2px 0;
      font-family: var(--sans);
      font-size: 12px;
      color: var(--faint);
      cursor: pointer;
      border-bottom: 1.5px solid transparent;
      transition: color 0.12s ease, border-color 0.12s ease;
    }

    .lang-btn:hover {
      color: var(--ink);
    }

    .lang-btn.active {
      color: var(--ink);
      font-weight: 600;
      border-bottom-color: var(--ink);
    }

    /* Interactive "Check the Numbers" Calculator */
    .calc-wrap {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .calc-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 12px;
    }

    .rupee-tag {
      font-family: var(--mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ink);
      font-weight: 600;
    }

    .calc-inputs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .calc-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .calc-field label {
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }

    .calc-input {
      appearance: none;
      background: var(--paper);
      border: 1px solid var(--line);
      padding: 6px 9px;
      font-family: var(--mono);
      font-size: 13.5px;
      font-weight: 500;
      color: var(--ink);
      width: 100%;
      transition: border-color 0.12s ease;
    }

    .calc-input:focus {
      outline: none;
      border-color: var(--ink);
    }

    .rupee-text {
      font-size: 14px;
      color: var(--ink);
      line-height: 1.55;
      background: var(--paper);
      border-left: 2px solid var(--ink);
      padding: 10px 14px;
    }

    /* Comparison View (2 Columns Side by Side) */
    .compare-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
    }

    .compare-col-title {
      font-family: var(--serif);
      font-size: 24px;
      font-weight: 400;
      margin-bottom: 6px;
    }

    .compare-stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 16px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      margin: 16px 0;
    }

    /* Sheet Footer */
    .sheet-footer {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      color: var(--faint);
      flex-wrap: wrap;
      gap: 12px;
    }

    .foot-links {
      display: flex;
      gap: 18px;
    }

    .text-btn {
      appearance: none;
      background: none;
      border: none;
      font-family: var(--sans);
      font-size: 12.5px;
      color: var(--muted);
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .text-btn:hover {
      color: var(--ink);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--ink);
      color: var(--paper);
      font-size: 13px;
      padding: 8px 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .toast.show {
      opacity: 1;
    }

    /* Responsive adjustments */
    @media (max-width: 820px) {
      .layout {
        grid-template-columns: 1fr;
        gap: 28px;
      }
      aside {
        position: static;
        border-bottom: 2px solid var(--line-dark);
        padding-bottom: 18px;
      }
      .nav-list {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 6px 14px;
      }
      .sidebar-hint {
        display: none;
      }
      .stat-strip {
        grid-template-columns: 1fr 1fr;
      }
      .stat-cell {
        padding: 14px 12px 14px 0 !important;
        border-bottom: 1px solid var(--line);
      }
      .stat-cell:nth-child(2n) {
        border-right: none;
        padding-left: 14px !important;
      }
      .kv-row {
        grid-template-columns: 1fr;
        gap: 4px;
      }
      .compare-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 24px 16px 64px;
      }
      .product-title {
        font-size: 24px;
      }
      .product-what {
        font-size: 15.5px;
      }
      .stat-val {
        font-size: 18px;
      }
      .catch-box {
        padding: 18px;
        margin-top: 22px;
      }
      .catch-lead {
        font-size: 18px;
      }
      .calc-input,
      .compare-select {
        font-size: 16px;
      }
    }
  </style>
</head>

      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

    let currentLang = localStorage.getItem("byi_lang") || "en";
    if (!window.I18N || !window.I18N.ui[currentLang]) currentLang = "en";

    // Per-product calculator state (persists while browsing/switching languages)
    const calcState = {};

    function getUI() {
      return (window.I18N && window.I18N.ui[currentLang]) || window.I18N.ui.en;
    }

    function getCalcConfig(id) {
      return window.I18N && window.I18N.calculators && window.I18N.calculators[id];
    }

    function getCalcValues(id) {
      const cfg = getCalcConfig(id);
      if (!cfg) return {};
      if (!calcState[id]) {
        calcState[id] = {};
        cfg.inputs.forEach(inp => {
          calcState[id][inp.key] = inp.defaultVal;
        });
      }
      return calcState[id];
    }

    function computeLiveMath(id, lang) {
      const cfg = getCalcConfig(id);
      const base = PRODUCTS.find(p => p.id === id);
      if (!cfg) return base ? base.rupeeMath : "";
      return cfg.compute(getCalcValues(id), lang || currentLang);
    }

    function getById(id) {
      const base = PRODUCTS.find(p => p.id === id);
      if (!base) return null;
      const ui = getUI();
      const tr = (currentLang !== "en" && window.I18N && window.I18N.products[currentLang] && window.I18N.products[currentLang][id]) || null;
      const merged = tr ? Object.assign({}, base, tr) : Object.assign({}, base);
      merged.groupLabel = (ui.groups && ui.groups[base.group]) || base.group;
      merged.liveRupeeMath = computeLiveMath(id, currentLang);
      return merged;
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 1800);
    }

    function syncFromHash() {
      const raw = window.location.hash.replace(/^#/, "").trim();
      if (!raw) return;
      const parts = raw.split("?");
      const route = parts[0];
      if (parts[1]) {
        const params = new URLSearchParams(parts[1]);
        const l = params.get("lang");
        if (l && window.I18N && window.I18N.ui[l]) {
          currentLang = l;
          localStorage.setItem("byi_lang", currentLang);
        }
      }
      if (route.includes("-vs-")) {
        const [a, b] = route.split("-vs-");
        if (PRODUCTS.some(p => p.id === a)) primaryId = a;
        if (PRODUCTS.some(p => p.id === b) && a !== b) compareId = b;
      } else if (PRODUCTS.some(p => p.id === route)) {
        primaryId = route;
        compareId = "";
      }
    }

    function updateHash() {
      const base = compareId ? `${primaryId}-vs-${compareId}` : primaryId;
      const langSuffix = currentLang !== "en" ? `?lang=${currentLang}` : "";
      history.replaceState(null, "", `#${base}${langSuffix}`);
    }

    function renderLangBar() {
      const bar = document.getElementById("langBar");
      if (!bar || !window.I18N) return;
      bar.innerHTML = window.I18N.langs.map(l => `
        <button type="button" class="lang-btn ${l.code === currentLang ? 'active' : ''}" data-lang="${l.code}" title="${l.native}">
          ${l.label}
        </button>
      `).join("");

      bar.querySelectorAll(".lang-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          currentLang = btn.dataset.lang;
          localStorage.setItem("byi_lang", currentLang);
          document.documentElement.lang = currentLang;
          updateHash();
          render();
        });
      });
    }

    function renderSidebar(activeId) {
      const ui = getUI();
      const container = document.getElementById("sidebarNav");
      container.innerHTML = GROUPS.map(g => {
        const items = PRODUCTS.filter(p => p.group === g).map(p => getById(p.id));
        const gLabel = (ui.groups && ui.groups[g]) || g;
        return `
          <div class="nav-group">
            <div class="nav-group-label">${gLabel}</div>
            <div class="nav-list">
              ${items.map(p => `
                <button type="button" class="nav-item ${p.id === activeId ? 'active' : ''}" data-id="${p.id}">
                  <span class="nav-num">${p.num}</span>
                  <span>${p.tab}</span>
                </button>
              `).join("")}
            </div>
          </div>
        `;
      }).join("");

      container.querySelectorAll(".nav-item").forEach(btn => {
        btn.addEventListener("click", () => {
          primaryId = btn.dataset.id;
          if (compareId === primaryId) compareId = "";
          updateHash();
          render();
        });
      });
    }

    function renderCalculatorHtml(p, isCompact) {
      const ui = getUI();
      const cfg = getCalcConfig(p.id);
      const vals = getCalcValues(p.id);
      if (!cfg) {
        return `
          <div class="rupee-check">
            <div class="rupee-tag">${ui.calcTitle}</div>
            <div class="rupee-text">${p.liveRupeeMath}</div>
          </div>
        `;
      }
      return `
        <div class="calc-wrap">
          <div class="calc-top">
            <div class="rupee-tag">${ui.calcTitle}</div>
          </div>
          <div class="calc-inputs" style="${isCompact ? 'grid-template-columns:1fr;gap:8px;' : ''}">
            ${cfg.inputs.map(inp => {
              const lbl = (inp.label && (inp.label[currentLang] || inp.label.en)) || inp.key;
              const val = vals[inp.key];
              return `
                <label class="calc-field">
                  <span>${lbl}</span>
                  <input
                    type="number"
                    class="calc-input"
                    data-pid="${p.id}"
                    data-key="${inp.key}"
                    min="${inp.min}"
                    max="${inp.max}"
                    step="${inp.step}"
                    value="${val}"
                  />
                </label>
              `;
            }).join("")}
          </div>
          <div class="rupee-text" id="calcOut-${p.id}" style="${isCompact ? 'font-size:13px;' : ''}">${p.liveRupeeMath}</div>
        </div>
      `;
    }

    function bindCalculatorInputs(container) {
      container.querySelectorAll(".calc-input").forEach(input => {
        input.addEventListener("input", () => {
          const pid = input.dataset.pid;
          const key = input.dataset.key;
          const raw = parseFloat(input.value);
          if (!Number.isFinite(raw)) return;
          const vals = getCalcValues(pid);
          vals[key] = raw;
          const outEl = container.querySelector(`#calcOut-${pid}`);
          if (outEl) {
            outEl.textContent = computeLiveMath(pid, currentLang);
          }
        });
      });
    }

    function renderSingle(p) {
      const ui = getUI();
      return `
        <div class="title-block">
          <h2 class="product-title">${p.name}</h2>
          <p class="product-what">${p.what}</p>
        </div>

        <div class="stat-strip">
          ${p.stats.map(s => `
            <div class="stat-cell">
              <div class="stat-label">${s.label}</div>
              <div class="stat-val">${s.val}</div>
              <div class="stat-note">${s.note}</div>
            </div>
          `).join("")}
        </div>

        <section class="spec-section">
          <div class="section-head">${ui.sec1}</div>
          <div class="kv-table">
            ${p.underlyingRows.map(([k, v]) => `
              <div class="kv-row">
                <div class="kv-key">${k}</div>
                <div class="kv-val">${v}</div>
              </div>
            `).join("")}
          </div>
        </section>

        <section class="spec-section">
          <div class="section-head">${ui.sec2}</div>
          <div class="kv-table">
            ${p.taxRows.map(([k, v]) => `
              <div class="kv-row">
                <div class="kv-key">${k}</div>
                <div class="kv-val">${v}</div>
              </div>
            `).join("")}
          </div>
        </section>

        <section class="catch-box">
          <div class="catch-label">${ui.sec3}</div>
          <p class="catch-lead">${p.catchLead}</p>
          <p class="catch-body">${p.catchBody}</p>
          ${renderCalculatorHtml(p, false)}
        </section>

        <section class="spec-section" style="border-bottom:none;padding-bottom:6px;">
          <div class="section-head">${ui.sec4}</div>
          <div class="kv-table">
            <div class="kv-row">
              <div class="kv-key">${ui.useIfKey}</div>
              <div class="kv-val">${p.useIf}</div>
            </div>
            <div class="kv-row">
              <div class="kv-key">${ui.avoidIfKey}</div>
              <div class="kv-val">${p.avoidIf}</div>
            </div>
          </div>
        </section>
      `;
    }

    function renderComparison(p1, p2) {
      const ui = getUI();
      function colHtml(p) {
        return `
          <div>
            <h2 class="compare-col-title">${p.name}</h2>
            <p class="product-what" style="font-size:15.5px;min-height:46px;">${p.what}</p>

            <div class="compare-stat-grid">
              ${p.stats.map(s => `
                <div>
                  <div class="stat-label">${s.label}</div>
                  <div class="stat-val" style="font-size:18px;">${s.val}</div>
                  <div class="stat-note">${s.note}</div>
                </div>
              `).join("")}
            </div>

            <div class="spec-section" style="padding:18px 0;">
              <div class="section-head">${ui.sec1Short}</div>
              <div class="kv-table">
                ${p.underlyingRows.map(([k, v]) => `
                  <div class="kv-row" style="grid-template-columns:1fr;gap:2px;padding:8px 0;">
                    <div class="kv-key">${k}</div>
                    <div class="kv-val" style="font-size:13.5px;">${v}</div>
                  </div>
                `).join("")}
              </div>
            </div>

            <div class="spec-section" style="padding:18px 0;">
              <div class="section-head">${ui.sec2Short}</div>
              <div class="kv-table">
                ${p.taxRows.map(([k, v]) => `
                  <div class="kv-row" style="grid-template-columns:1fr;gap:2px;padding:8px 0;">
                    <div class="kv-key">${k}</div>
                    <div class="kv-val" style="font-size:13.5px;">${v}</div>
                  </div>
                `).join("")}
              </div>
            </div>

            <div class="catch-box" style="margin-top:18px;padding:18px 20px;">
              <div class="catch-label">${ui.sec3}</div>
              <p class="catch-lead" style="font-size:17.5px;">${p.catchLead}</p>
              <p class="catch-body" style="font-size:13.5px;">${p.catchBody}</p>
              ${renderCalculatorHtml(p, true)}
            </div>

            <div class="spec-section" style="padding:18px 0 4px;border-bottom:none;">
              <div class="section-head">${ui.sec4}</div>
              <div class="kv-table">
                <div class="kv-row" style="grid-template-columns:1fr;gap:2px;padding:8px 0;">
                  <div class="kv-key">${ui.useIfKey}</div>
                  <div class="kv-val" style="font-size:13.5px;">${p.useIf}</div>
                </div>
                <div class="kv-row" style="grid-template-columns:1fr;gap:2px;padding:8px 0;">
                  <div class="kv-key">${ui.avoidIfKey}</div>
                  <div class="kv-val" style="font-size:13.5px;">${p.avoidIf}</div>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      return `
        <div class="compare-grid" style="padding-top:20px;">
          ${colHtml(p1)}
          ${colHtml(p2)}
        </div>
      `;
    }

    function render() {
      const ui = getUI();
      document.documentElement.lang = currentLang;

      // Update static UI labels
      document.getElementById("brandTitle").textContent = ui.brandTitle;
      document.getElementById("brandSub").textContent = ui.brandSub;
      document.getElementById("kbHint").textContent = ui.kbHint;
      document.getElementById("bylinePrefix").textContent = ui.bylinePrefix;
      document.getElementById("compareWithLabel").textContent = ui.compareWith;
      document.getElementById("footerMetaPrefix").textContent = ui.footerMeta;
      document.getElementById("copyLinkBtn").textContent = ui.copyLink;
      document.getElementById("shareCardBtn").textContent = ui.downloadPng;

      renderLangBar();

      const p1 = getById(primaryId) || getById(PRODUCTS[0].id);
      const p2 = compareId && compareId !== primaryId ? getById(compareId) : null;

      renderSidebar(p1.id);

      document.getElementById("sheetKicker").textContent = p2
        ? `${ui.sideBySide}  ·  ${p1.num} VS ${p2.num}`
        : `${p1.num} / 13  ·  ${p1.groupLabel.toUpperCase()}`;

      const select = document.getElementById("compareSelect");
      select.innerHTML =
        `<option value="">${ui.noneSingle}</option>` +
        `<optgroup label="${ui.compareOptGroup}">` +
        PRODUCTS.filter(p => p.id !== p1.id).map(rawP => {
          const lp = getById(rawP.id);
          return `<option value="${lp.id}" ${p2 && p2.id === lp.id ? 'selected' : ''}>${lp.num} · ${lp.tab}</option>`;
        }).join("") +
        `</optgroup>` +
        `<optgroup label="${ui.commonConfusions}">` +
        POPULAR_PAIRS.map(pair => {
          const pa = getById(pair.a);
          const pb = getById(pair.b);
          const lbl = currentLang === "en" ? pair.label : `${pa.tab} vs ${pb.tab}`;
          return `<option value="pair:${pair.a}:${pair.b}">${lbl}</option>`;
        }).join("") +
        `</optgroup>`;

      const content = document.getElementById("sheetContent");
      content.innerHTML = p2 ? renderComparison(p1, p2) : renderSingle(p1);
      bindCalculatorInputs(content);
    }

    document.getElementById("compareSelect").addEventListener("change", (e) => {
      const val = e.target.value;
      if (val.startsWith("pair:")) {
        const [, a, b] = val.split(":");
        primaryId = a;
        compareId = b;
      } else {
        compareId = val;
      }
      updateHash();
      render();
    });

    // Keyboard navigation (Up/Down arrows to step through the 13 products)
    window.addEventListener("keydown", (e) => {
      if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) return;
      const idx = PRODUCTS.findIndex(p => p.id === primaryId);
      if (e.key === "ArrowDown" || e.key === "j") {
        e.preventDefault();
        const next = PRODUCTS[(idx + 1) % PRODUCTS.length];
        primaryId = next.id;
        if (compareId === primaryId) compareId = "";
        updateHash();
        render();
      } else if (e.key === "ArrowUp" || e.key === "k") {
        e.preventDefault();
        const prev = PRODUCTS[(idx - 1 + PRODUCTS.length) % PRODUCTS.length];
        primaryId = prev.id;
        if (compareId === primaryId) compareId = "";
        updateHash();
        render();
      }
    });

    document.getElementById("copyLinkBtn").addEventListener("click", async () => {
      updateHash();
      try {
        await navigator.clipboard.writeText(window.location.href);
        showToast(getUI().copiedToast);
      } catch (_e) {}
    });

    // High-DPI Swiss Spec Card PNG Generator (Multilingual + Live Calculator Math)
    function wrapText(ctx, text, maxWidth) {
      const words = String(text || "").split(" ");
      const lines = [];
      let line = "";
      for (const w of words) {
        const test = line ? line + " " + w : w;
        if (ctx.measureText(test).width > maxWidth && line) {
          lines.push(line);
          line = w;
        } else {
          line = test;
        }
      }
      if (line) lines.push(line);
      return lines;
    }

    document.getElementById("shareCardBtn").addEventListener("click", () => {
      const ui = getUI();
      const p1 = getById(primaryId) || getById(PRODUCTS[0].id);
      const p2 = compareId && compareId !== primaryId ? getById(compareId) : null;

      const fontSans = `"Inter", "Noto Sans Kannada", "Noto Sans Devanagari", "Noto Sans Telugu", "Noto Sans Tamil", sans-serif`;
      const fontSerif = `"Newsreader", "Noto Sans Kannada", "Noto Sans Devanagari", "Noto Sans Telugu", "Noto Sans Tamil", Georgia, serif`;
      const fontMono = `"JetBrains Mono", "Noto Sans Kannada", "Noto Sans Devanagari", "Noto Sans Telugu", "Noto Sans Tamil", monospace`;

      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      if (!p2) {
        // Single Product Spec Card (1080 x 1560 — portrait for WhatsApp / X / Instagram)
        const p = p1;
        canvas.width = 1080;
        canvas.height = 1560;

        ctx.fillStyle = "#FAF9F5";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = "#141413";
        ctx.lineWidth = 2;
        ctx.strokeRect(48, 48, canvas.width - 96, canvas.height - 96);

        let y = 112;
        ctx.fillStyle = "#969188";
        ctx.font = `500 18px ${fontMono}`;
        ctx.fillText(`${ui.brandTitle.toUpperCase()}  ·  ${p.num} / 13  ·  ${p.groupLabel.toUpperCase()}`, 88, y);

        y += 52;
        ctx.fillStyle = "#141413";
        ctx.font = `500 40px ${fontSerif}`;
        ctx.fillText(p.name, 88, y);

        y += 36;
        ctx.fillStyle = "#5C5953";
        ctx.font = `italic 21px ${fontSerif}`;
        for (const l of wrapText(ctx, p.what, 904)) {
          ctx.fillText(l, 88, y);
          y += 30;
        }

        y += 12;
        ctx.strokeStyle = "#141413";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(88, y);
        ctx.lineTo(992, y);
        ctx.stroke();

        // 4-Stat Strip
        const statY = y + 32;
        const colW = 904 / 4;
        p.stats.forEach((s, i) => {
          const x = 88 + i * colW + (i > 0 ? 12 : 0);
          if (i > 0) {
            ctx.strokeStyle = "#E4E0D7";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(88 + i * colW, y);
            ctx.lineTo(88 + i * colW, statY + 68);
            ctx.stroke();
          }
          ctx.fillStyle = "#969188";
          ctx.font = `500 13px ${fontMono}`;
          ctx.fillText(s.label.toUpperCase(), x, statY);

          ctx.fillStyle = "#141413";
          ctx.font = `500 22px ${fontSerif}`;
          ctx.fillText(s.val, x, statY + 30);

          ctx.fillStyle = "#5C5953";
          ctx.font = `400 14px ${fontSans}`;
          ctx.fillText(s.note, x, statY + 54);
        });

        y = statY + 72;
        ctx.strokeStyle = "#E4E0D7";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(88, y);
        ctx.lineTo(992, y);
        ctx.stroke();

        // Section 01: What Sits Underneath
        y += 32;
        ctx.fillStyle = "#969188";
        ctx.font = `500 15px ${fontMono}`;
        ctx.fillText(ui.sec1.toUpperCase(), 88, y);
        y += 26;

        for (const [k, v] of p.underlyingRows) {
          ctx.fillStyle = "#141413";
          ctx.font = `600 17px ${fontSans}`;
          ctx.fillText(k, 88, y);

          ctx.fillStyle = "#5C5953";
          ctx.font = `400 17px ${fontSans}`;
          const lines = wrapText(ctx, v, 650);
          lines.forEach((l, li) => {
            ctx.fillText(l, 330, y + li * 24);
          });
          y += Math.max(1, lines.length) * 24 + 12;
        }

        ctx.strokeStyle = "#E4E0D7";
        ctx.beginPath();
        ctx.moveTo(88, y - 4);
        ctx.lineTo(992, y - 4);
        ctx.stroke();

        // Section 02: Taxation & Costs
        y += 28;
        ctx.fillStyle = "#969188";
        ctx.font = `500 15px ${fontMono}`;
        ctx.fillText(ui.sec2.toUpperCase(), 88, y);
        y += 26;

        for (const [k, v] of p.taxRows) {
          ctx.fillStyle = "#141413";
          ctx.font = `600 17px ${fontSans}`;
          ctx.fillText(k, 88, y);

          ctx.fillStyle = "#5C5953";
          ctx.font = `400 17px ${fontSans}`;
          const lines = wrapText(ctx, v, 650);
          lines.forEach((l, li) => {
            ctx.fillText(l, 330, y + li * 24);
          });
          y += Math.max(1, lines.length) * 24 + 12;
        }

        // Section 03: The Catch Box + Interactive Calculator Math
        y += 8;
        ctx.font = `500 21px ${fontSerif}`;
        const catchLeadLines = wrapText(ctx, p.catchLead, 848);
        ctx.font = `400 16.5px ${fontSans}`;
        const catchBodyLines = wrapText(ctx, p.catchBody, 848);
        ctx.font = `400 16.5px ${fontSans}`;
        const rupeeLines = wrapText(ctx, p.liveRupeeMath, 848);
        const boxH = 122 + catchLeadLines.length * 29 + catchBodyLines.length * 24 + rupeeLines.length * 24;

        ctx.fillStyle = "#F2EFE9";
        ctx.fillRect(88, y, 904, boxH);
        ctx.fillStyle = "#141413";
        ctx.fillRect(88, y, 904, 3);

        let cy = y + 32;
        ctx.fillStyle = "#141413";
        ctx.font = `600 14px ${fontMono}`;
        ctx.fillText(ui.sec3.toUpperCase(), 116, cy);
        cy += 30;

        ctx.font = `500 21px ${fontSerif}`;
        for (const l of catchLeadLines) {
          ctx.fillText(l, 116, cy);
          cy += 29;
        }
        cy += 4;
        ctx.fillStyle = "#5C5953";
        ctx.font = `400 16.5px ${fontSans}`;
        for (const l of catchBodyLines) {
          ctx.fillText(l, 116, cy);
          cy += 24;
        }

        cy += 8;
        ctx.strokeStyle = "#E4E0D7";
        ctx.beginPath();
        ctx.moveTo(116, cy);
        ctx.lineTo(964, cy);
        ctx.stroke();

        cy += 24;
        ctx.fillStyle = "#141413";
        ctx.font = `600 13.5px ${fontMono}`;
        ctx.fillText(ui.calcPngLabel, 116, cy);
        cy += 24;
        ctx.font = `400 16.5px ${fontSans}`;
        rupeeLines.forEach((l, li) => {
          ctx.fillText(l, 116, cy + li * 24);
        });

        y += boxH + 26;

        // Section 04: The Verdict (Use if / Avoid if)
        ctx.fillStyle = "#969188";
        ctx.font = `500 15px ${fontMono}`;
        ctx.fillText(ui.sec4.toUpperCase(), 88, y);
        y += 26;

        for (const [k, v] of [[ui.useIfKey, p.useIf], [ui.avoidIfKey, p.avoidIf]]) {
          ctx.fillStyle = "#141413";
          ctx.font = `600 17px ${fontSans}`;
          ctx.fillText(k, 88, y);

          ctx.fillStyle = "#5C5953";
          ctx.font = `400 17px ${fontSans}`;
          const lines = wrapText(ctx, v, 650);
          lines.forEach((l, li) => {
            ctx.fillText(l, 330, y + li * 24);
          });
          y += Math.max(1, lines.length) * 24 + 12;
        }

        ctx.fillStyle = "#969188";
        ctx.font = `400 17px ${fontSerif}`;
        ctx.fillText(`${ui.brandTitle}  ·  FY 2025–26 Indian Tax Reference`, 88, 1482);

        ctx.textAlign = "right";
        ctx.fillStyle = "#5C5953";
        ctx.font = `500 15px ${fontMono}`;
        ctx.fillText("By Dinesh Pai  ·  dineshpai.in  ·  @dineshpaii", 992, 1482);
        ctx.textAlign = "left";
      } else {
        // Side-by-Side Comparison Card (1200 x 1420)
        canvas.width = 1200;
        canvas.height = 1420;

        ctx.fillStyle = "#FAF9F5";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = "#141413";
        ctx.lineWidth = 2;
        ctx.strokeRect(44, 44, canvas.width - 88, canvas.height - 88);

        ctx.fillStyle = "#969188";
        ctx.font = `500 18px ${fontMono}`;
        ctx.fillText(`${ui.brandTitle.toUpperCase()}  ·  ${ui.sideBySide}`, 84, 108);

        ctx.strokeStyle = "#141413";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(84, 128);
        ctx.lineTo(1116, 128);
        ctx.stroke();

        // Center divider
        ctx.strokeStyle = "#E4E0D7";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(600, 128);
        ctx.lineTo(600, 1300);
        ctx.stroke();

        [p1, p2].forEach((p, idx) => {
          const x = idx === 0 ? 84 : 628;
          const maxW = 480;
          let y = 178;

          ctx.fillStyle = "#141413";
          ctx.font = `500 30px ${fontSerif}`;
          ctx.fillText(p.name, x, y);
          y += 32;

          ctx.fillStyle = "#5C5953";
          ctx.font = `italic 17px ${fontSerif}`;
          for (const l of wrapText(ctx, p.what, maxW).slice(0, 2)) {
            ctx.fillText(l, x, y);
            y += 24;
          }

          y += 18;
          // 2x2 stats
          p.stats.forEach((s, si) => {
            const sx = x + (si % 2) * 244;
            const sy = y + Math.floor(si / 2) * 74;
            ctx.fillStyle = "#969188";
            ctx.font = `500 12.5px ${fontMono}`;
            ctx.fillText(s.label.toUpperCase(), sx, sy);
            ctx.fillStyle = "#141413";
            ctx.font = `500 20px ${fontSerif}`;
            ctx.fillText(s.val, sx, sy + 26);
            ctx.fillStyle = "#5C5953";
            ctx.font = `400 13.5px ${fontSans}`;
            ctx.fillText(s.note, sx, sy + 46);
          });

          y += 164;
          ctx.fillStyle = "#969188";
          ctx.font = `500 13.5px ${fontMono}`;
          ctx.fillText(ui.sec1Short.toUpperCase(), x, y);
          y += 22;
          for (const [k, v] of p.underlyingRows.slice(0, 2)) {
            ctx.fillStyle = "#141413";
            ctx.font = `600 15.5px ${fontSans}`;
            ctx.fillText(k, x, y);
            y += 20;
            ctx.fillStyle = "#5C5953";
            ctx.font = `400 14.5px ${fontSans}`;
            for (const l of wrapText(ctx, v, maxW).slice(0, 2)) {
              ctx.fillText(l, x, y);
              y += 20;
            }
            y += 8;
          }

          y += 8;
          ctx.fillStyle = "#969188";
          ctx.font = `500 13.5px ${fontMono}`;
          ctx.fillText(ui.sec2Short.toUpperCase(), x, y);
          y += 22;
          for (const [k, v] of p.taxRows.slice(0, 3)) {
            ctx.fillStyle = "#141413";
            ctx.font = `600 15.5px ${fontSans}`;
            ctx.fillText(k, x, y);
            y += 20;
            ctx.fillStyle = "#5C5953";
            ctx.font = `400 14.5px ${fontSans}`;
            for (const l of wrapText(ctx, v, maxW).slice(0, 2)) {
              ctx.fillText(l, x, y);
              y += 20;
            }
            y += 8;
          }

          // The Catch + Live Calculator Math
          const cyStart = 815;
          ctx.fillStyle = "#F2EFE9";
          ctx.fillRect(x, cyStart, maxW, 300);
          ctx.fillStyle = "#141413";
          ctx.fillRect(x, cyStart, maxW, 3);

          let cy = cyStart + 28;
          ctx.fillStyle = "#141413";
          ctx.font = `600 13px ${fontMono}`;
          ctx.fillText(ui.sec3.toUpperCase(), x + 20, cy);
          cy += 24;
          ctx.font = `500 18px ${fontSerif}`;
          for (const l of wrapText(ctx, p.catchLead, maxW - 40).slice(0, 3)) {
            ctx.fillText(l, x + 20, cy);
            cy += 24;
          }
          cy += 8;
          ctx.strokeStyle = "#E4E0D7";
          ctx.beginPath();
          ctx.moveTo(x + 20, cy);
          ctx.lineTo(x + maxW - 20, cy);
          ctx.stroke();

          cy += 22;
          ctx.fillStyle = "#141413";
          ctx.font = `600 12.5px ${fontMono}`;
          ctx.fillText(ui.calcPngLabel, x + 20, cy);
          cy += 20;
          ctx.fillStyle = "#141413";
          ctx.font = `400 14px ${fontSans}`;
          for (const l of wrapText(ctx, p.liveRupeeMath, maxW - 40).slice(0, 4)) {
            ctx.fillText(l, x + 20, cy);
            cy += 20;
          }

          // 04 · The Verdict
          let vy = 1146;
          ctx.fillStyle = "#969188";
          ctx.font = `500 13px ${fontMono}`;
          ctx.fillText(ui.sec4.toUpperCase(), x, vy);
          vy += 22;
          for (const [k, v] of [[ui.useIfKey, p.useIf], [ui.avoidIfKey, p.avoidIf]]) {
            ctx.fillStyle = "#141413";
            ctx.font = `600 14.5px ${fontSans}`;
            ctx.fillText(k, x, vy);
            vy += 19;
            ctx.fillStyle = "#5C5953";
            ctx.font = `400 14px ${fontSans}`;
            for (const l of wrapText(ctx, v, maxW).slice(0, 2)) {
              ctx.fillText(l, x, vy);
              vy += 19;
            }
            vy += 8;
          }
        });

        ctx.fillStyle = "#969188";
        ctx.font = `400 17px ${fontSerif}`;
        ctx.fillText(`${ui.brandTitle}  ·  FY 2025–26 Indian Tax Reference`, 84, 1344);

        ctx.textAlign = "right";
        ctx.fillStyle = "#5C5953";
        ctx.font = `500 15px ${fontMono}`;
        ctx.fillText("By Dinesh Pai  ·  dineshpai.in  ·  @dineshpaii", 1116, 1344);
        ctx.textAlign = "left";
      }

      // Immediately trigger PNG file download in the browser
      const langSuffix = currentLang !== "en" ? `-${currentLang}` : "";
      const filename = p2
        ? `${p1.id}-vs-${p2.id}-before-you-invest${langSuffix}.png`
        : `${p1.id}-before-you-invest${langSuffix}.png`;
      const dataUrl = canvas.toDataURL("image/png");
      const a = document.createElement("a");
      a.href = dataUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast(`${ui.downloadedToast} ${filename}`);
    });

    window.addEventListener("hashchange", () => {
      syncFromHash();
      render();
    });

    syncFromHash();
    render();
  </script>
</body>
</html>
